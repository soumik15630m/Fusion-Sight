# FusionSight ALL-IN-ONE (single laptop): `docker compose up --build`
#
# Runs every service on one machine over the compose network. For the 3-laptop
# split (detector / fusion / broadcast on separate machines) use the per-role
# stacks under deploy/<role>/ instead -- see DEPLOY.md.
#
#   detector    - FastAPI + YOLO, GPU inference (+ operator video relay)
#   fusion      - cross-feed correlation, pose/ghost/map state (no GPU)
#   web         - Next.js operator/device client
#   proxy       - Caddy, single origin routing to detector/fusion/web
#   cloudflared - Cloudflare tunnel exposing the proxy over HTTPS

services:
  detector:
    build:
      context: .
      dockerfile: detector/Dockerfile
    environment:
      BATTLESIGHT_DEVICE: "0"                 # first GPU; "cpu" to run without one
      FUSION_WS_URL: "ws://fusion:8100/ws/ingest"
    expose:
      - "8000"
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  fusion:
    build:
      context: .
      dockerfile: fusion/Dockerfile
    environment:
      FUSION_ENABLED: "1"
      # Phone-GPS demo tuning: consumer GPS can't separate people in one room,
      # so widen the match radius and lengthen the "concurrent" window.
      FUSION_BASE_RADIUS_M: "20"
      FUSION_WINDOW_MS: "1500"
      FUSION_POSE_MAX_AGE_MS: "5000"
    expose:
      - "8100"
    restart: unless-stopped

  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_BACKEND_SAME_ORIGIN: "1"
    expose:
      - "3000"
    restart: unless-stopped

  proxy:
    image: caddy:2-alpine
    depends_on:
      - detector
      - fusion
      - web
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
    ports:
      - "8080:80"
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    depends_on:
      - proxy
    command: tunnel --no-autoupdate --url http://proxy:80
    restart: unless-stopped
